  .card {
    display:flex; flex-direction:column; align-items:center;
    text-align:center; gap:22px; max-width:440px; width:100%;
  }
  .mark { width:46px; height:46px; }
  .name {
    font-family:'Fraunces', Georgia, serif;
    font-optical-sizing:auto;
    font-weight:450;
    font-size:35px; line-height:1.1;
    letter-spacing:-0.01em;
  }
  .line {
    font-family:'Fraunces', Georgia, serif;
    font-optical-sizing:auto;
    font-weight:450;
    font-size:19px; line-height:1.4; letter-spacing:-0.005em;
    color:var(--ink-soft);
  }
  .line .build { position:relative; white-space:nowrap; }
  .line .build::after {
    content:""; position:absolute; left:0; right:0; bottom:-3px;
    border-bottom:2.5px dotted var(--ink);
  }
  .sub {
    margin-top:-12px;
    font-size:14px; font-weight:400; color:var(--muted);
    line-height:1.55; max-width:340px;
  }

  /* things i've built */
  .built {
    width:100%; margin-top:10px;
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .built-label {
    font-size:12px; font-weight:500; color:var(--muted);
    letter-spacing:0.02em;
  }
  .built-label::after {
    content:""; display:block; width:28px; height:0;
    border-bottom:1px dotted var(--hairline);
    margin:9px auto 0;
  }
  .grid {
    display:grid; grid-template-columns:repeat(3, 1fr);
    gap:12px; width:236px; max-width:100%; margin:0 auto; justify-self:center;
  }
  .cell { display:flex; flex-direction:column; align-items:center; gap:7px; min-width:0; }
  .tile {
    aspect-ratio:1; border-radius:13px; width:100%;
    display:flex; align-items:center; justify-content:center;
  }
  .tile.filled {
    background:transparent; border:1.5px solid var(--hairline);
    text-decoration:none;
    transition:border-color .18s ease, transform .18s ease;
  }
  .tile.filled:hover { border-color:var(--ink); transform:translateY(-2px); }
  .tile.filled svg { width:52%; height:52%; }
  .tile.empty { border:2px dotted var(--dot); }
  .tile.building { background:transparent; border:1.5px solid var(--hairline); cursor:default; }
  .tile.building .proj-mark { width:66%; height:66%; }
  .tile.building .proj-logo { height:58%; width:auto; max-width:74%; opacity:1; }
  .cap {
    height:18px; display:inline-flex; align-items:center; justify-content:center;
    gap:4px; font-size:9px; font-weight:600; line-height:1; letter-spacing:0.03em;
    color:var(--ink-soft); white-space:nowrap;
  }
  .cap.pill { background:#F0E8DF; border-radius:999px; padding:0 8px; }
  .cap .dot { width:4px; height:4px; border-radius:50%; background:#8A8A82; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.3; } 50% { opacity:1; } }

  .links {
    display:flex; align-items:center; gap:16px;
    margin-top:10px;
    font-size:14px; font-weight:500;
  }
  .links a {
    color:var(--muted); text-decoration:none;
    transition:color .18s ease;
  }
  .links a:hover { color:var(--ink); }
  .link-btn {
    font:inherit; background:none; border:none; cursor:pointer; padding:0;
    color:var(--muted); font-size:14px; font-weight:500;
    transition:color .18s ease;
  }
  .link-btn:hover { color:var(--ink); }
  .overlay {
    position:fixed; inset:0; z-index:50;
    background:rgba(20,20,19,0.28);
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center;
    padding:24px; opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .overlay.open { opacity:1; pointer-events:auto; }
  .overlay[hidden] { display:none; }
  .modal {
    background:var(--paper);
    border:1px solid var(--hairline); border-radius:16px;
    width:100%; max-width:380px; padding:30px 28px 26px;
    box-shadow:0 18px 50px rgba(20,20,19,0.14);
    transform:translateY(8px) scale(.985);
    transition:transform .2s ease; position:relative; text-align:left;
  }
  .overlay.open .modal { transform:none; }
  .modal h3 {
    font-family:'Fraunces', Georgia, serif; font-optical-sizing:auto;
    font-weight:450; font-size:22px; margin-bottom:4px;
  }
  .modal .hint { font-size:13.5px; color:var(--ink-soft); margin-bottom:18px; line-height:1.5; }
  .close {
    position:absolute; top:14px; right:14px;
    width:30px; height:30px; border:none; background:none;
    cursor:pointer; color:var(--muted); font-size:20px; line-height:1;
    border-radius:8px;
  }
  .close:hover { color:var(--ink); background:var(--hairline); }
  .field { display:flex; flex-direction:column; gap:5px; margin-bottom:13px; }
  .field label { font-size:12px; color:var(--ink-soft); font-weight:500; }
  .field input, .field textarea {
    font:inherit; font-size:14px; color:var(--ink);
    background:#fff; border:1.5px solid var(--hairline);
    border-radius:9px; padding:10px 12px; width:100%;
    outline:none; transition:border-color .16s ease;
  }
  .field input:focus, .field textarea:focus { border-color:var(--ink); }
  .field textarea { resize:vertical; min-height:84px; }
  .send {
    width:100%; margin-top:4px; font:inherit; font-size:15px; font-weight:500;
    color:var(--paper); background:var(--ink);
    border:none; border-radius:999px; min-height:48px; cursor:pointer;
    transition:opacity .16s ease;
  }
  .send:hover { opacity:.88; }
  .send:disabled { opacity:.5; cursor:default; }
  .status { font-size:13px; color:var(--ink-soft); text-align:center; margin-top:12px; min-height:18px; }
  .sent-msg { text-align:center; padding:10px 0 4px; }
  .sent-msg .big {
    font-family:'Fraunces', Georgia, serif; font-optical-sizing:auto;
    font-weight:450; font-size:20px; display:block; margin-bottom:6px;
  }
  .sent-msg .small { font-size:13px; color:var(--muted); }
  .foot {
    margin-top:6px; font-size:12px; color:var(--muted);
  }
  .foot a { color:var(--muted); text-decoration:none; border-bottom:1px dotted var(--hairline); }
  .foot a:hover { color:var(--ink); }
</style>

  <div class="overlay" id="contactOverlay" role="dialog" aria-modal="true" aria-labelledby="contactTitle" hidden>
    <div class="modal">
      <button type="button" class="close" id="closeContact" aria-label="close">×</button>
      <h3 id="contactTitle">get in touch</h3>
      <p class="hint">a note, a hello, a thing to build. i read everything.</p>
      <form id="contactForm">
        <div class="field">
          <label for="cf-name">name</label>
          <input id="cf-name" name="name" type="text" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="cf-email">email</label>
          <input id="cf-email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="cf-msg">message</label>
          <textarea id="cf-msg" name="message" required></textarea>
        </div>
        <!-- spam trap: hidden from people, bots fill it in -->
        <input id="cf-website" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" />
        <button type="submit" class="send" id="cf-send">send</button>
        <p class="status" id="cf-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <script>
  (function () {
    var overlay = document.getElementById("contactOverlay");
    var openBtn = document.getElementById("openContact");
    var closeBtn = document.getElementById("closeContact");
    var form = document.getElementById("contactForm");
    var statusEl = document.getElementById("cf-status");
    var sendBtn = document.getElementById("cf-send");
    var lastFocused = null;
    function openModal() {
      lastFocused = document.activeElement;
      overlay.hidden = false;
      requestAnimationFrame(function () { overlay.classList.add("open"); });
      document.getElementById("cf-name").focus();
      document.addEventListener("keydown", onKey);
    }
    function closeModal() {
      overlay.classList.remove("open");
      document.removeEventListener("keydown", onKey);
      setTimeout(function () { overlay.hidden = true; }, 200);
      if (lastFocused) lastFocused.focus();
    }
    function onKey(e) { if (e.key === "Escape") closeModal(); }
    openBtn.addEventListener("click", openModal);
    closeBtn.addEventListener("click", closeModal);
    overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      sendBtn.disabled = true;
      statusEl.textContent = "sending…";
      // /api/contact (a Vercel function) emails the note through Resend.
      fetch("/api/contact", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: document.getElementById("cf-name").value.trim(),
          email: document.getElementById("cf-email").value.trim(),
          message: document.getElementById("cf-msg").value.trim(),
          website: document.getElementById("cf-website").value
        })
      }).then(function (r) {
        if (r.ok) {
          document.getElementById("contactTitle").hidden = true;
          document.querySelector(".modal .hint").hidden = true;
          form.innerHTML = "<div class='sent-msg'><span class='big'>thanks, your note is on its way.</span><span class='small'>i read everything.</span></div>";
        } else {
          sendBtn.disabled = false;
          statusEl.textContent = "something went wrong. try again in a moment.";
        }
      }).catch(function () {
        sendBtn.disabled = false;
        statusEl.textContent = "something went wrong. try again in a moment.";
      });
    });
  })();
  </script>
